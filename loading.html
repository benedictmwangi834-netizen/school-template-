<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratify School - Loading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --secondary: #0EA5E9;
            --success: #22C55E;
            --bg: #F1F5F9;
            --text: #0F172A;
            --text-secondary: #475569;
            --border: #E2E8F0;
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --border: #334155;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== LOADING CONTAINER ===== */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            animation: fadeIn 0.8s ease;
        }

        /* ===== LOGO ===== */
        .loading-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 4.5rem;
            color: var(--primary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .logo-icon i {
            filter: drop-shadow(0 4px 20px rgba(79, 70, 229, 0.3));
        }

        .school-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 2px;
        }

        .school-name span {
            color: var(--primary);
        }

        .tagline {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: -4px;
            letter-spacing: 1px;
        }

        /* ===== SPINNER ===== */
        .spinner-container {
            margin-top: 10px;
            position: relative;
            width: 60px;
            height: 60px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 76px;
            height: 76px;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary-light);
            border-radius: 50%;
            animation: spin 1.2s linear infinite reverse;
            opacity: 0.5;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-wrapper {
            width: 280px;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% 100%;
            border-radius: 10px;
            animation: progressLoad 2.5s ease-in-out forwards, shimmer 1.5s ease-in-out infinite;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ===== LOADING DOTS ===== */
        .dots {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite both;
        }

        .dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .dots span:nth-child(3) {
            animation-delay: 0s;
        }

        /* ===== TIPS ===== */
        .tips-container {
            margin-top: 24px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tip {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 380px;
            padding: 12px 24px;
            background: var(--border);
            border-radius: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
            line-height: 1.6;
        }

        .tip.show {
            opacity: 1;
        }

        .tip i {
            color: var(--primary);
            margin-right: 8px;
        }

        /* ===== VERSION ===== */
        .version {
            position: fixed;
            bottom: 20px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* ===== SKIP BUTTON ===== */
        .skip-btn {
            margin-top: 16px;
            padding: 8px 24px;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .skip-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }

        @keyframes progressLoad {
            0% {
                width: 0%;
            }
            10% {
                width: 8%;
            }
            30% {
                width: 28%;
            }
            50% {
                width: 52%;
            }
            70% {
                width: 76%;
            }
            90% {
                width: 92%;
            }
            100% {
                width: 100%;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .logo-icon {
                font-size: 3.5rem;
            }
            .school-name {
                font-size: 2rem;
            }
            .tagline {
                font-size: 0.85rem;
            }
            .progress-wrapper {
                width: 220px;
            }
            .tip {
                font-size: 0.8rem;
                padding: 10px 16px;
                max-width: 300px;
            }
            .spinner-container,
            .spinner {
                width: 48px;
                height: 48px;
            }
            .spinner-ring {
                width: 64px;
                height: 64px;
                top: -8px;
                left: -8px;
            }
        }

        @media (max-width: 360px) {
            .school-name {
                font-size: 1.6rem;
            }
            .progress-wrapper {
                width: 180px;
            }
            .tip {
                font-size: 0.75rem;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING CONTAINER ===== -->
    <div class="loading-container" id="loadingContainer">
        <!-- Logo -->
        <div class="loading-logo">
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div class="school-name">
                Stratify <span>School</span>
            </div>
            <div class="tagline">Empowering Education Through Technology</div>
        </div>

        <!-- Spinner -->
        <div class="spinner-container">
            <div class="spinner"></div>
            <div class="spinner-ring"></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="progressLabel">Loading...</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Dots -->
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Tips -->
        <div class="tips-container">
            <div class="tip show" id="tip">
                <i class="fas fa-lightbulb"></i>
                <span id="tipText">Preparing your experience...</span>
            </div>
        </div>

        <!-- Skip Button -->
        <button class="skip-btn" onclick="redirectToHome()">
            <i class="fas fa-forward"></i> Skip to Home
        </button>
    </div>

    <!-- Version -->
    <div class="version">v2.0</div>

    <script>
        // ================================================================
        // REDIRECT TO HOMEPAGE
        // ================================================================
        function redirectToHome() {
            const container = document.getElementById('loadingContainer');
            container.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.98)';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 700);
        }

        // ================================================================
        // LOADING TIPS
        // ================================================================
        const loadingTips = [
            '📚 We have over 500 students enrolled!',
            '🎓 95% university placement rate for graduates.',
            '🏆 Ranked #1 school in the region.',
            '🌍 Exchange programs with 12 countries.',
            '💡 AI assistant coming soon to help you!',
            '📱 Access your portal from any device.',
            '💰 Pay fees easily using M-Pesa integration.',
            '⭐ 4.8/5 rating from parents.',
            '📊 Track your child\'s progress in real-time.',
            '🎯 Personalized learning paths for every student.',
            '🏅 Over 100 awards won in the last 5 years.',
            '🌐 Students from 15 different nationalities.',
            '📈 98% parent satisfaction rate.',
            '🎨 State-of-the-art facilities and labs.',
            '🤝 Strong alumni network across the globe.'
        ];

        // ================================================================
        // PROGRESS SIMULATION
        // ================================================================
        let progress = 0;
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressLabel = document.getElementById('progressLabel');

        function simulateProgress() {
            const interval = setInterval(() => {
                let increment;
                if (progress < 70) {
                    increment = Math.random() * 6 + 2;
                } else if (progress < 90) {
                    increment = Math.random() * 3 + 1;
                } else {
                    increment = Math.random() * 1.5 + 0.5;
                }

                progress = Math.min(progress + increment, 100);
                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.round(progress) + '%';

                if (progress < 30) {
                    progressLabel.textContent = 'Initializing...';
                } else if (progress < 60) {
                    progressLabel.textContent = 'Loading resources...';
                } else if (progress < 85) {
                    progressLabel.textContent = 'Almost ready...';
                } else {
                    progressLabel.textContent = 'Finalizing...';
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    progressLabel.textContent = 'Ready!';
                    setTimeout(redirectToHome, 600);
                }
            }, 120);
        }

        // ================================================================
        // TIPS ROTATION
        // ================================================================
        let tipIndex = 0;
        const tipText = document.getElementById('tipText');
        const tipElement = document.getElementById('tip');

        function rotateTip() {
            tipElement.classList.remove('show');
            setTimeout(() => {
                tipIndex = (tipIndex + 1) % loadingTips.length;
                tipText.textContent = loadingTips[tipIndex];
                tipElement.classList.add('show');
            }, 400);
        }

        // ================================================================
        // THEME TOGGLE (Respect user preference)
        // ================================================================
        function setTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('theme');

            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (prefersDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        // ================================================================
        // KEYBOARD SHORTCUT
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                redirectToHome();
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        setTheme();

        tipText.textContent = loadingTips[0];
        tipElement.classList.add('show');

        setTimeout(simulateProgress, 400);
        setInterval(rotateTip, 2500);

        // Safety net - redirect after 6 seconds max
        setTimeout(() => {
            if (progress < 100) {
                redirectToHome();
            }
        }, 6000);

        // ================================================================
        // CONSOLE LOGO
        // ================================================================
        console.log('%c 🎓 Stratify School ', 'background: #4F46E5; color: white; padding: 12px 20px; font-size: 20px; font-weight: bold; border-radius: 8px;');
        console.log('%c Loading... Please wait while we prepare your experience.', 'color: #4F46E5; font-size: 14px;');
        console.log('%c Press ENTER or click Skip to go to the homepage.', 'color: #94A3B8; font-size: 12px;');
    </script>
</body>
</html>
